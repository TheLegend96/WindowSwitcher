      <stop offset="0%" stop-color="#5E5CE6"/>
      <stop offset="45%" stop-color="#3634A3"/>
      <stop offset="85%" stop-color="#1B194B"/>
      <stop offset="100%" stop-color="#0E0C28"/>
    </radialGradient>
    <linearGradient id="p4_bev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9A98FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0E0C28" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="p4_porcelain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F2EFFF"/>
      <stop offset="100%" stop-color="#DCD4FF"/>
    </linearGradient>
    <linearGradient id="p4_rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
