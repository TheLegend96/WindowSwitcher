  </defs>

  <rect x="6" y="6" width="228" height="228" rx="52" fill="url(#p4_bg)"/>
  <rect x="7" y="7" width="226" height="226" rx="51" stroke="url(#p4_bev)" stroke-width="2"/>
  <rect x="8" y="8" width="224" height="224" rx="50" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1"/>

  <circle cx="120" cy="120" r="55" fill="#BF5AF2" opacity="0.3" filter="blur(20px)"/>

  <!-- Liquid Meniscus Bridge connecting two bold offset window planes -->
  <g filter="url(#p4_sh)">
    <!-- Primary Connected Fluid Shape: Window 1 (Top-Left 96x78) flowing into Window 2 (Bottom-Right 96x78) -->
    <path d="M 64 48 L 126 48 A 22 22 0 0 1 148 70 L 148 80 C 148 114, 158 126, 184 126 L 192 126 A 22 22 0 0 1 214 148 L 214 174 A 22 22 0 0 1 192 196 L 130 196 A 22 22 0 0 1 108 174 L 108 164 C 108 130, 98 118, 72 118 L 64 118 A 22 22 0 0 1 42 96 L 42 70 A 22 22 0 0 1 64 48 Z" 
