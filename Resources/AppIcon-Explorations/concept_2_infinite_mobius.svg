<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="p2_bg" cx="50%" cy="30%" r="85%" fx="50%" fy="15%">
      <stop offset="0%" stop-color="#38ACFF"/>
      <stop offset="45%" stop-color="#0A84FF"/>
      <stop offset="85%" stop-color="#0058C6"/>
      <stop offset="100%" stop-color="#002D7A"/>
    </radialGradient>
    <linearGradient id="p2_bev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A0D4FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#002275" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="p2_glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F0F7FF"/>
      <stop offset="100%" stop-color="#CCE5FF"/>
    </linearGradient>
    <linearGradient id="p2_rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="p2_core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#70D7FF"/>
      <stop offset="100%" stop-color="#0060DF"/>
    </linearGradient>
    <filter id="p2_sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#002875" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="228" height="228" rx="52" fill="url(#p2_bg)"/>
  <rect x="7" y="7" width="226" height="226" rx="51" stroke="url(#p2_bev)" stroke-width="2"/>
  <rect x="8" y="8" width="224" height="224" rx="50" stroke="#000000" stroke-opacity="0.12" stroke-width="1"/>

  <circle cx="120" cy="120" r="60" fill="#70D7FF" opacity="0.25" filter="blur(22px)"/>

  <!-- Infinite Dual-Window Mobius Loop -->
  <g filter="url(#p2_sh)">
    <!-- Base Ribbon Body -->
    <path d="M 72 58 L 102 58 C 122 58, 132 74, 140 92 C 148 110, 158 126, 178 126 L 186 126 A 22 22 0 0 1 208 148 L 208 156 A 22 22 0 0 1 186 178 L 156 178 C 136 178, 126 162, 118 144 C 110 126, 100 110, 80 110 L 72 110 A 22 22 0 0 1 50 88 L 50 80 A 22 22 0 0 1 72 58 Z" 
          fill="url(#p2_glass)"/>
    <path d="M 72 58 L 102 58 C 122 58, 132 74, 140 92 C 148 110, 158 126, 178 126 L 186 126 A 22 22 0 0 1 208 148 L 208 156 A 22 22 0 0 1 186 178 L 156 178 C 136 178, 126 162, 118 144 C 110 126, 100 110, 80 110 L 72 110 A 22 22 0 0 1 50 88 L 50 80 A 22 22 0 0 1 72 58 Z" 
          stroke="url(#p2_rim)" stroke-width="2" fill="none"/>

    <!-- Window Aperture 1: Top-Left Space -->
    <rect x="68" y="74" width="28" height="22" rx="7" fill="url(#p2_core)" opacity="0.35" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.2"/>
    
    <!-- Window Aperture 2: Bottom-Right Space -->
    <rect x="162" y="140" width="28" height="22" rx="7" fill="url(#p2_core)" opacity="0.4" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.2"/>

    <!-- Luminous Conduit Ray -->
    <path d="M 82 85 C 122 85, 136 151, 176 151" stroke="#70D7FF" stroke-width="4.5" stroke-linecap="round" opacity="0.9" filter="drop-shadow(0 0 6px #70D7FF)"/>
    <path d="M 82 85 C 122 85, 136 151, 176 151" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>
</svg>