<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="p3_bg" cx="50%" cy="30%" r="85%" fx="50%" fy="15%">
      <stop offset="0%" stop-color="#2C2C2E"/>
      <stop offset="50%" stop-color="#1C1C1E"/>
      <stop offset="85%" stop-color="#0E0F12"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>
    <linearGradient id="p3_bev" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A5A5E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#151518" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="p3_front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F2F2F7"/>
      <stop offset="100%" stop-color="#D1D1D6"/>
    </linearGradient>
    <linearGradient id="p3_mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#545458"/>
      <stop offset="100%" stop-color="#2C2C2E"/>
    </linearGradient>
    <linearGradient id="p3_back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A3A3C"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <linearGradient id="p3_laser" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#63E6E2"/>
      <stop offset="50%" stop-color="#30D158"/>
      <stop offset="100%" stop-color="#25A244"/>
    </linearGradient>
    <filter id="p3_sh1" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
    <filter id="p3_sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="228" height="228" rx="52" fill="url(#p3_bg)"/>
  <rect x="7" y="7" width="226" height="226" rx="51" stroke="url(#p3_bev)" stroke-width="2"/>
  <rect x="8" y="8" width="224" height="224" rx="50" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Back Glass Window Slab -->
  <rect x="42" y="44" width="108" height="80" rx="20" fill="url(#p3_back)" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.4"/>

  <!-- Mid Glass Window Slab -->
  <g filter="url(#p3_sh2)">
    <rect x="66" y="72" width="114" height="86" rx="22" fill="url(#p3_mid)" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.6"/>
  </g>

  <!-- Fluid Phosphor Laser cutting across the 3 planes -->
  <path d="M 48 50 C 95 95, 145 145, 192 190" stroke="url(#p3_laser)" stroke-width="8" stroke-linecap="round" opacity="0.3" filter="blur(4px)"/>
  <path d="M 48 50 C 95 95, 145 145, 192 190" stroke="url(#p3_laser)" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M 48 50 C 95 95, 145 145, 192 190" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>

  <!-- Front Hero Porcelain Window Slab -->
  <g filter="url(#p3_sh1)">
    <rect x="92" y="100" width="112" height="88" rx="24" fill="url(#p3_front)"/>
    <rect x="93" y="101" width="110" height="86" rx="23" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.8"/>
    <!-- Sculptural Active Pill -->
    <rect x="110" y="118" width="30" height="7" rx="3.5" fill="#30D158"/>
    <circle cx="184" cy="121.5" r="3.5" fill="#30D158" opacity="0.8"/>
  </g>
</svg>